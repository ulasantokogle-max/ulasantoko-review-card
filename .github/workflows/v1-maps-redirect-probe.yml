name: V1 Maps Redirect Diagnosis (No Secrets)
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/v1-maps-link-probe.cjs"
      - "scripts/v1-productmate-api-probe.cjs"
      - ".github/workflows/v1-maps-redirect-probe.yml"
permissions:
  contents: read
jobs:
  probe-v1-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/v1-maps-link-probe.cjs

      - run: node scripts/v1-productmate-api-probe.cjs
