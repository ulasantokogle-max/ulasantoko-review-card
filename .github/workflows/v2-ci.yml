name: V2 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # CI-only placeholders. Never use these values in production.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      ADMIN_KEY: ci-placeholder-admin-key
      GOOGLE_MAPS_API_KEY: ci-placeholder-google-maps-key
      SHORTIO_API_KEY: ci-placeholder-shortio-key
      SHORTIO_DOMAIN: ulasantoko.space

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Next.js build
        run: npm run build
