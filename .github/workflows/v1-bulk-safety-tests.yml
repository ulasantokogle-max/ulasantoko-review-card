name: V1 Bulk Safety Tests
on:
  pull_request:
    branches: [main]
    paths:
      - "lib/v1-bulk-csv.ts"
      - "app/admin/provider/bulk-designer/page.tsx"
      - "app/api/v1/provider/validate-cards/route.ts"
      - "tests/v1-bulk-csv.test.cjs"
      - "tests/v1-migration-gate.test.cjs"
      - "tests/v1-public-card.test.cjs"
      - "tests/v1-project-guard.test.cjs"
      - "lib/v1-project-guard.ts"
      - "lib/v1-supabase.ts"
      - "app/card/[cardCode]/page.tsx"
      - "app/api/cards/activate/route.ts"
      - "app/api/cards/create/route.ts"
      - "app/api/v1/provider/bulk-create/route.ts"
      - ".github/workflows/v1-bulk-safety-tests.yml"
  push:
    branches: [feature/v1-bulk-create-designer-isolated]
jobs:
  csv-origin-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify V1-only CSV safety and duplicate rejection
        run: node --test tests/v1-bulk-csv.test.cjs tests/v1-migration-gate.test.cjs tests/v1-public-card.test.cjs
