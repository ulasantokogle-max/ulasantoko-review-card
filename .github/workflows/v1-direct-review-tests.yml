name: V1 Redirect Policy Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/v1-direct-review-redirect-20261025]

jobs:
  v1-url-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test V1 Google Review URL allowlist
        run: node --test tests/v1-review-redirect.test.cjs
