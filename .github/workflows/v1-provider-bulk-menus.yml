name: V1 Provider Bulk Menus Safety
on:
  pull_request:
    branches: [main]
    paths:
      - "app/admin/provider/**"
      - "app/api/v1/provider/bulk-create/**"
      - "app/api/v1/provider/status/**"
      - "app/api/v1/provider/validate-cards/**"
      - "lib/v1-supabase.ts"
      - "lib/v1-project-guard.ts"
      - "lib/v1-bulk-csv.ts"
      - "tests/v1-provider-bulk-menus.test.cjs"
      - "tests/v1-bulk-csv.test.cjs"
      - "tests/v1-project-guard.test.cjs"
      - "tests/v1-readiness.test.cjs"
      - "tests/v1-cutover-isolation.test.cjs"
      - "tests/v1-bulk-create-rate-limit.test.cjs"
      - "app/api/cards/create/route.ts"
      - "app/api/cards/activate/route.ts"
      - "app/api/v1/provider/cards/route.ts"
      - "app/r-v1/**"
      - "app/card/**"
      - "app/admin/cards/**"
      - "app/api/v1/provider/status/route.ts"
      - "app/admin/provider/diagnostics/page.tsx"
      - ".github/workflows/v1-provider-bulk-menus.yml"
jobs:
  v1-provider-menus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node --test tests/v1-provider-bulk-menus.test.cjs tests/v1-bulk-csv.test.cjs tests/v1-project-guard.test.cjs tests/v1-readiness.test.cjs tests/v1-cutover-isolation.test.cjs tests/v1-bulk-create-rate-limit.test.cjs
