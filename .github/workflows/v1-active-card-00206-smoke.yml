name: V1 Active Card 00206 Production Smoke
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/v1-active-card-00206-smoke.cjs"
      - ".github/workflows/v1-active-card-00206-smoke.yml"
permissions:
  contents: read
jobs:
  read-only-production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/v1-active-card-00206-smoke.cjs
